<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Payment | Zamove</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/utilities.css">
    </head>
<body data-p="checkout">
    <div class="nav-ph" aria-hidden="true"></div>

    <main id="main" class="wrap sec">
        <h1 class="u3">Pay for your trip</h1>
        <div class="two r">
            <div class="card">
                <div data-st="">

                    <form id="pay">
                        <fieldset class="u8">
                            <legend><b>Payment method</b></legend>
                            
                            <label>
                                <input type="radio" name="m" value="mtn_momo" checked> MTN Mobile Money</label>
                            <label>
                                <input type="radio" name="m" value="airtel_money"> Airtel Money</label>
                            <label>
                                <input type="radio" name="m" value="card"> Visa or Mastercard</label>
                        </fieldset>
                        
                        <p class="alert bad" role="note"><b>Demonstration payment.</b> No money is charged and no number is sent anywhere.</p>
                            <div id="hold" class="chip w" role="timer"></div>
                            
                            <label><input id="fail" type="checkbox"> Demo: simulate a failed payment</label>
                                
                                <p><button class="btn o">Pay <span id="amt"></span></button></p>
                                
                                <p class="mu">A real payment partner will replace this demo gateway.</p>
                    </form>
                </div>

                <div data-st="p" class="stt hid" role="status"><b>⏳</b>Processing…</div>
                <div data-st="s" class="stt hid" role="status"><b class="u9">✓</b>Payment received. Opening your ticket…</div>
                <div data-st="f" class="stt hid" role="alert"><b class="u10">✕</b>Payment failed. Your seats stay held until the timer ends.
                    <p>
                    <button id="retry" class="btn">Try again</button>
                    </p>
                </div>
            </div>

            <aside class="card">
                <h3>Booking summary</h3>
                
                <div id="sum"></div>
            </aside>
        </div>
    </main>

    <script defer src="js/api.js"></script>

    <script defer src="js/guard.js" data-roles="customer"></script>

    <script defer src="js/safe.js"></script><script defer src="js/app.js"></script>
</body>
</html>

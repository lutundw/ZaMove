<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Zamove</title><link rel="stylesheet" href="css/style.css"></head>
<body data-p="login">
<main id="main" class="wrap sec" style="max-width:480px"><h1 style="font-size:2rem">Welcome to Zamove</h1><div class="tabs"><button data-tab="in" aria-selected="true">Log in</button><button data-tab="reg" aria-selected="false">Register</button></div>
<form class="card" data-panel="in"><label for="e1">Email</label><input id="e1" class="in" type="email" required><label for="p1">Password</label><input id="p1" class="in" type="password" required><label for="r1">Log in as</label><select id="r1" name="role" class="in"><option value="customer">Passenger</option><option value="operator">Bus operator</option><option value="admin">Admin</option></select><p><button class="btn" style="width:100%">Log in</button></p><a href="#">Forgot password?</a></form>
<form class="card hid" data-panel="reg"><label for="r2">I am a</label><select id="r2" name="role" class="in"><option value="customer">Passenger</option><option value="operator">Bus operator</option></select><label for="n2">Full name or company</label><input id="n2" class="in" required><label for="e2">Email</label><input id="e2" class="in" type="email" required><label for="t2">Phone</label><input id="t2" class="in" type="tel" required><label for="p2">Password</label><input id="p2" class="in" type="password" minlength="8" required><p><button class="btn" style="width:100%">Create account</button></p><p class="mu">Bus operators are approved by an admin before they can sell tickets.</p></form></main>
<script src="js/app.js"></script></body></html>

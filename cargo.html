<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send cargo | ZamuMove</title><link rel="stylesheet" href="css/style.css"></head>
<body data-p="cargo">
<main id="main" class="wrap sec" style="max-width:760px"><h1 style="font-size:2rem">Send cargo</h1><div class="tabs"><button data-tab="r" aria-selected="true">Request</button><button data-tab="q" aria-selected="false">Quotes</button><button data-tab="s" aria-selected="false">Status</button></div>
<form id="rq" class="card" data-panel="r"><div class="row"><div style="flex:1"><label for="f">Pickup town</label><select id="f" class="in"><option>Lusaka</option><option>Kitwe</option><option>Ndola</option><option>Chipata</option></select></div><div style="flex:1"><label for="t">Delivery town</label><select id="t" class="in"><option>Kabwe</option><option>Livingstone</option><option>Solwezi</option></select></div></div>
<label for="c">What are you sending?</label><select id="c" class="in"><option>Luggage or bags</option><option>Parcels or boxes</option><option>Farm produce</option><option>Electronics</option><option>Furniture</option><option>Other</option></select><label for="d">Describe the items</label><textarea id="d" class="in" required></textarea><div class="row"><div style="flex:1"><label for="w">Weight (kg)</label><input id="w" class="in" type="number" min="1" required></div><div style="flex:1"><label for="z">Size</label><select id="z" class="in"><option>Small</option><option>Medium</option><option>Large</option></select></div></div><label><input type="checkbox"> Fragile</label><p><button class="btn o">Request quotes</button></p></form>
<div data-panel="q" class="hid"><p class="chip w">3 operators replied</p><div class="card row"><div><b>Shalom Bus</b><br><span class="mu">Delivery in 1 day</span></div><div class="big sp">K 120</div><button class="btn s acc">Accept</button></div><div class="card row"><div><b>Mazhandu Family Bus</b><br><span class="mu">Delivery in 1 day</span></div><div class="big sp">K 150</div><button class="btn s acc">Accept</button></div><div class="card row"><div><b>Power Tools</b><br><span class="mu">Delivery the same day</span></div><div class="big sp">K 190</div><button class="btn s acc">Accept</button></div></div>
<div data-panel="s" class="card hid"><h3>Cargo CG7801</h3><ul class="tl"><li class="d">Requested</li><li class="d">Quote accepted</li><li>Paid</li><li>Handed to operator</li><li>In transit</li><li>Delivered</li></ul></div></main>
<script src="js/app.js"></script></body></html>

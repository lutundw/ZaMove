# =============================================================================
# ZaMove Lab 5, Task 1: TLS 1.3 only + HSTS + HTTP -> HTTPS upgrade, for XAMPP Apache.
#
# Where it goes:   C:\xampp\apache\conf\extra\httpd-ssl-zamove.conf
# Then add this line at the END of C:\xampp\apache\conf\httpd.conf (and restart Apache):
#       Include "conf/extra/httpd-ssl-zamove.conf"
#
# Before that, check that these lines are NOT commented out in httpd.conf (no leading #):
#       LoadModule ssl_module      modules/mod_ssl.so
#       LoadModule headers_module  modules/mod_headers.so
#       LoadModule rewrite_module  modules/mod_rewrite.so
#       Include conf/extra/httpd-ssl.conf        <- you may also comment this out: this file replaces it
#
# Certificate (mkcert, run once in PowerShell):
#       mkcert -install
#       mkcert -cert-file localhost.pem -key-file localhost-key.pem localhost 127.0.0.1 ::1
#   copy localhost.pem      -> C:\xampp\apache\conf\ssl.crt\localhost.pem
#   copy localhost-key.pem  -> C:\xampp\apache\conf\ssl.key\localhost-key.pem
# =============================================================================

Listen 443

# ---- TLS settings (global) ---------------------------------------------------
SSLProtocol            -all +TLSv1.3
SSLCipherSuite         TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
SSLSessionTickets      off
SSLSessionCache        "shmcb:logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# ---- Port 80: never serve anything, only upgrade to HTTPS ---------------------
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    # 308 (not 301) keeps the HTTP method, so a POST is not turned into a GET
    RewriteRule ^ https://localhost%{REQUEST_URI} [R=308,L]
</VirtualHost>

# ---- Port 443 -------------------------------------------------------------------
<VirtualHost _default_:443>
    ServerName localhost:443
    DocumentRoot "C:/xampp/htdocs"

    SSLEngine on
    SSLCertificateFile    "C:/xampp/apache/conf/ssl.crt/localhost.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/localhost-key.pem"

    # HSTS: the browser remembers for one year to use HTTPS only for this host.
    # "setifempty" avoids a duplicate header: the PHP API already sends the same value.
    Header always setifempty Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory "C:/xampp/htdocs/zamove">
        # lets api/v1/.htaccess send every /api/v1/... request to index.php
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

openapi: 3.1.0
info:
  title: ZaMove API
  version: 1.0.0
  summary: Transportation and logistics booking platform for Zambia
  description: 'Contract-first description of the ZaMove REST API (Labs 4 and 5, ICT461).


    * All endpoints are served over **HTTPS (TLS 1.3)** only.

    * Request bodies are JSON and are validated against the schemas in `components/schemas` (JSON Schema
    2020-12, `additionalProperties: false`) before any business logic runs.

    * Every error is an RFC 7807 `application/problem+json` document.

    * Authentication is a server-side session identified by an `HttpOnly; Secure; SameSite=Strict` cookie.

    * Every response carries `RateLimit-*` headers; breaching a limit returns **429**.'
  license:
    name: Coursework (ICT461), Mulungushi University
    identifier: NOASSERTION
servers:
- url: https://localhost/zamove/api/v1
  description: Local XAMPP over HTTPS (replaced automatically with the real host when served by the API)
tags:
- name: Users
  description: Account registration and the signed-in profile
- name: Sessions
  description: Login and logout (server-side sessions, cookie transport)
- name: Bookings
  description: A signed-in customer's bookings
security: []
paths:
  /users:
    post:
      operationId: createUser
      tags:
      - Users
      summary: Register a customer or operator account
      description: Creates an account. `role` can only be `customer` or `operator`; `admin` accounts are
        never created through the API. Operators start as `pending` until an administrator approves them.
      x-rate-limit:
        limit: 20
        windowSeconds: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              role: customer
              full_name: Jane Phiri
              email: jane.phiri@example.com
              phone: 0965551234
              password: Sunrise2026
      responses:
        '201':
          description: Account created
          headers:
            RateLimit-Limit: &id001
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining: &id002
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset: &id003
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/me:
    get:
      operationId: getCurrentUser
      tags:
      - Users
      summary: Profile of the signed-in user
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The signed-in user
          headers:
            RateLimit-Limit: *id001
            RateLimit-Remaining: *id002
            RateLimit-Reset: *id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions:
    post:
      operationId: login
      tags:
      - Sessions
      summary: Log in and start a session
      description: Verifies the credentials and, on success, creates a server-side session and returns
        its identifier **only** in a `Set-Cookie` header (`HttpOnly`, `Secure`, `SameSite=Strict`). The
        identifier is never present in the JSON body.
      x-rate-limit:
        limit: 5
        windowSeconds: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jane.phiri@example.com
              password: Sunrise2026
      responses:
        '200':
          description: Logged in
          headers:
            RateLimit-Limit: *id001
            RateLimit-Remaining: *id002
            RateLimit-Reset: *id003
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sessions/current:
    delete:
      operationId: logout
      tags:
      - Sessions
      summary: Log out (revoke the current session)
      description: Deletes the session record on the server and expires the cookie in the browser. Replaying
        the old cookie afterwards returns 401.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Logged out
          headers:
            RateLimit-Limit: *id001
            RateLimit-Remaining: *id002
            RateLimit-Reset: *id003
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /bookings:
    get:
      operationId: listBookings
      tags:
      - Bookings
      summary: List the signed-in customer's bookings
      description: Only parameters declared below are accepted; any other query parameter is rejected
        with 400.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of bookings
          headers:
            RateLimit-Limit: *id001
            RateLimit-Remaining: *id002
            RateLimit-Reset: *id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-zamove_sid
      description: Opaque 256-bit session identifier issued by POST /sessions. The browser stores and
        sends it automatically; JavaScript cannot read it (HttpOnly).
  parameters:
    Status:
      name: status
      in: query
      required: false
      description: Filter by booking status
      schema:
        type: string
        enum:
        - pending
        - accepted
        - rejected
        - confirmed
        - in_transit
        - completed
        - cancelled
    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
        minimum: 0
        default: 0
  headers:
    RateLimit-Limit:
      description: Requests allowed in the current window
      schema:
        type: integer
        minimum: 1
    RateLimit-Remaining:
      description: Requests left in the current window
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the window resets
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying (sent with 429)
      schema:
        type: integer
        minimum: 0
    Set-Cookie:
      description: '`__Host-zamove_sid=<64 hex>; expires=...; Max-Age=...; path=/; secure; HttpOnly; SameSite=Strict`'
      schema:
        type: string
    Set-Cookie-Expired:
      description: Same cookie with an expiry date in the past (instructs the browser to delete it)
      schema:
        type: string
    WWW-Authenticate:
      description: '`Cookie realm="zamove"` (sent with 401)'
      schema:
        type: string
  schemas:
    UserCreate:
      type: object
      description: Registration payload. Unknown properties are rejected (mass-assignment protection).
      required:
      - role
      - full_name
      - email
      - phone
      - password
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - customer
          - operator
          x-sanitize: text
          x-messages:
            required: Choose Passenger or Bus operator.
            enum: Choose Passenger or Bus operator.
            type: Choose Passenger or Bus operator.
        full_name:
          type: string
          minLength: 2
          maxLength: 120
          pattern: ^[\p{L}\p{N}][\p{L}\p{N} .'&-]*$
          x-sanitize: text
          x-messages:
            required: Enter your full name or company name.
            type: Enter your full name or company name.
            minLength: Name must be at least 2 characters.
            maxLength: Name must be 120 characters or fewer.
            pattern: Use letters, numbers, spaces and . ' & - only.
        email:
          type: string
          format: email
          maxLength: 150
          x-sanitize: email
          x-messages:
            required: Enter your email address.
            type: Enter your email address.
            maxLength: Email must be 150 characters or fewer.
            format: Enter a valid email address, for example name@example.com.
        phone:
          type: string
          pattern: ^(?:\+260|0)[79]\d{8}$
          x-sanitize: phone
          description: Zambian mobile number. Stored in +260 form.
          x-messages:
            required: Enter your phone number.
            type: Enter your phone number.
            pattern: Enter a Zambian mobile number, for example 0971234567 or +260971234567.
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          x-sanitize: none
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$
          x-messages:
            required: Choose a password.
            type: Choose a password.
            minLength: Password must be at least 8 characters.
            maxLength: Password must be 72 characters or fewer.
            pattern: Password needs a lowercase letter, an uppercase letter and a number.
    LoginRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          x-sanitize: email
          x-messages:
            required: Enter your email address.
            type: Enter your email address.
            maxLength: Email must be 150 characters or fewer.
            format: Enter a valid email address.
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          x-sanitize: none
          x-messages:
            required: Enter your password.
            type: Enter your password.
            minLength: Enter your password.
            maxLength: Password must be 72 characters or fewer.
    UserPublic:
      type: object
      additionalProperties: false
      required:
      - user_id
      - full_name
      - email
      - phone
      - role
      - account_status
      properties:
        user_id:
          type: integer
          minimum: 1
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 150
        phone:
          type: string
          pattern: ^\+260[79]\d{8}$
        role:
          type: string
          enum:
          - customer
          - operator
          - admin
        account_status:
          type: string
          enum:
          - pending
          - active
          - suspended
    UserCreated:
      type: object
      additionalProperties: false
      required:
      - message
      - user
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - user
      - expires_at
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session (UTC). The session also ends after 30 minutes without
            activity.
    Message:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
    Booking:
      type: object
      additionalProperties: false
      required:
      - booking_id
      - booking_reference
      - booking_type
      - booking_status
      - total_amount
      - currency
      - created_at
      properties:
        booking_id:
          type: integer
          minimum: 1
        booking_reference:
          type: string
          maxLength: 30
        booking_type:
          type: string
          enum:
          - passenger
          - cargo
        booking_status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          - confirmed
          - in_transit
          - completed
          - cancelled
        total_amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        created_at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
    BookingList:
      type: object
      additionalProperties: false
      required:
      - data
      - total
      - limit
      - offset
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: RFC 7807 Problem Details. Extension members (such as `errors`) are allowed by the RFC.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          examples:
          - https://zamove.example/problems/validation-error
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
        code:
          type: string
          description: The JSON Schema keyword that failed (for example `pattern`, `minLength`, `required`,
            `additionalProperties`)
        message:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: 'The request is malformed: empty body, invalid JSON, body is not an object, or an unknown
        / invalid query parameter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://zamove.example/problems/bad-request
            title: Bad Request
            status: 400
            detail: The request body is not valid JSON.
            instance: /zamove/api/v1/users
    Unauthorized:
      description: 'No valid session: missing, unknown, expired, revoked or wrong credentials'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://zamove.example/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required. Log in and try again.
            instance: /zamove/api/v1/users/me
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
    Forbidden:
      description: 'Understood but refused: HTTPS required, cross-origin request, or account not active'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://zamove.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: Cross-origin requests are not allowed.
            instance: /zamove/api/v1/sessions
    Conflict:
      description: The email is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    PayloadTooLarge:
      description: The request body is larger than 10 KB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body is not application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: The JSON is well formed but one or more fields break the schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://zamove.example/problems/validation-error
            title: Validation failed
            status: 422
            detail: The request body does not match the schema.
            instance: /zamove/api/v1/users
            errors:
            - field: email
              code: format
              message: Enter a valid email address, for example name@example.com.
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit: *id001
        RateLimit-Remaining: *id002
        RateLimit-Reset: *id003
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    ServerError:
      description: Unexpected failure. Details are logged on the server and never returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
